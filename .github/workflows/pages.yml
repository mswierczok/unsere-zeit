name: Unsere Zeit – Kalender aktualisieren und Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'  # ungefähr stündlich, GitHub kann verzögern

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: unsere-zeit-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Python-Abhängigkeiten installieren
        run: pip install -r requirements.txt
      - name: Kalenderparser und verschlüsselten IU-Import testen
        run: python -m unittest discover -s tests -v
      - name: Verschlüsselte Kalenderdatei erstellen
        env:
          SYNC_PASSPHRASE: ${{ secrets.SYNC_PASSPHRASE }}
          ICLOUD_APPLE_ID: ${{ secrets.ICLOUD_APPLE_ID }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          ICLOUD_CALENDAR_NAMES: 'Arbeit,Studium,Privat'
          MYDUTY_SHARE_URL: ${{ secrets.MYDUTY_SHARE_URL }}
          IU_ICS_IMPORT_KEY: ${{ secrets.IU_ICS_IMPORT_KEY }}
        run: python scripts/build_snapshot.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
